
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What State Is This? — All 50 States</title>
<style>
:root {
  color-scheme: dark;
  font-family: system-ui, -apple-system, sans-serif;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:#0b1324;
  color:#f4f7ff;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:16px;
}
.game {
  width:min(100%,640px);
  background:#142039;
  border:1px solid #334562;
  border-radius:22px;
  padding:clamp(16px,4vw,30px);
  box-shadow:0 12px 40px #0005;
}
h1 {
  font-size:clamp(25px,5vw,35px);
  margin:0 0 4px;
  text-align:center;
}
.sub {
  color:#aebed7;
  text-align:center;
  margin:0 0 20px;
}
.stats {
  display:flex;
  justify-content:space-between;
  font-weight:650;
  margin-bottom:8px;
}
.progress {
  height:9px;
  background:#33405a;
  border-radius:10px;
  overflow:hidden;
}
.progress div {
  height:100%;
  width:0;
  background:#60d5b5;
  transition:width .25s;
}
.outline {
  height:260px;
  margin:20px 0 16px;
  display:grid;
  place-items:center;
  background:#0a162b;
  border-radius:14px;
  border:1px solid #2c3950;
}
svg {
  display:block;
  width:100%;
  height:100%;
  max-width:470px;
}
#shape {
  fill:#68c9ec;
  stroke:#e7f7ff;
  stroke-width:1;
  vector-effect:non-scaling-stroke;
  stroke-linejoin:round;
}
#status {
  text-align:center;
  color:#aebed7;
  margin:8px 0 16px;
  min-height:22px;
}
.answers {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
button {
  font:inherit;
  border:1px solid #536785;
  background:#233552;
  color:white;
  border-radius:12px;
  padding:15px 10px;
  cursor:pointer;
  font-weight:650;
  min-height:54px;
}
button:focus-visible {
  outline:3px solid #ffd166;
  outline-offset:2px;
}
button:hover:not(:disabled) {
  background:#324b72;
}
button:disabled {
  cursor:default;
  opacity:.8;
}
button.correct {
  background:#177458;
  border-color:#59e6a9;
  opacity:1;
}
button.wrong {
  background:#903d4b;
  border-color:#ff9ba9;
  opacity:1;
}
.actions {
  display:flex;
  justify-content:center;
  margin-top:17px;
}
#next {
  background:#496dff;
  border-color:#849cff;
  min-width:170px;
}
#next:disabled {display:none}
#error {
  color:#ffc7c7;
  text-align:center;
}
@media(max-width:400px) {
  .answers {grid-template-columns:1fr}
  .outline {height:210px}
}
</style>
</head>
<body>
<main class="game">
<h1>🇺🇸 What State Is This?</h1>
<p class="sub">Identify all 50 states by their outlines!</p>

<div class="stats">
  <span id="count">Question 1 of 50</span>
  <span id="score">Score: 0</span>
</div>
<div class="progress"><div id="bar"></div></div>

<div class="outline">
  <svg id="map" viewBox="0 0 400 250"
       role="img" aria-label="Outline of a mystery US state">
    <path id="shape"/>
  </svg>
</div>

<p id="status" aria-live="polite">Which state is this?</p>
<div class="answers" id="answers"></div>
<div class="actions">
  <button id="next" disabled>Next state →</button>
</div>
<p id="error" role="alert"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const states = {
 "01":"Alabama","02":"Alaska","04":"Arizona","05":"Arkansas",
 "06":"California","08":"Colorado","09":"Connecticut","10":"Delaware",
 "12":"Florida","13":"Georgia","15":"Hawaii","16":"Idaho",
 "17":"Illinois","18":"Indiana","19":"Iowa","20":"Kansas",
 "21":"Kentucky","22":"Louisiana","23":"Maine","24":"Maryland",
 "25":"Massachusetts","26":"Michigan","27":"Minnesota","28":"Mississippi",
 "29":"Missouri","30":"Montana","31":"Nebraska","32":"Nevada",
 "33":"New Hampshire","34":"New Jersey","35":"New Mexico","36":"New York",
 "37":"North Carolina","38":"North Dakota","39":"Ohio","40":"Oklahoma",
 "41":"Oregon","42":"Pennsylvania","44":"Rhode Island","45":"South Carolina",
 "46":"South Dakota","47":"Tennessee","48":"Texas","49":"Utah",
 "50":"Vermont","51":"Virginia","53":"Washington","54":"West Virginia",
 "55":"Wisconsin","56":"Wyoming"
};

const $ = id => document.getElementById(id);
const ids = Object.keys(states);

let shapes, order, index, points, answered;

function shuffle(array) {
 for(let i=array.length-1;i>0;i--) {
  const j=Math.floor(Math.random()*(i+1));
  [array[i],array[j]]=[array[j],array[i]];
 }
 return array;
}

function startGame() {
 order=shuffle([...ids]);
 index=0;
 points=0;
 $("next").textContent="Next state →";
 showQuestion();
}

function showQuestion() {
 answered=false;
 const id=order[index], feature=shapes.get(id);

 $("count").textContent=`Question ${index+1} of 50`;
 $("score").textContent=`Score: ${points}`;
 $("bar").style.width=(index/50*100)+"%";
 $("status").textContent="Which state is this?";
 $("next").disabled=true;

 const projection=d3.geoAlbersUsa();
 const pathGenerator=d3.geoPath(projection);
 const svg=$("map"), path=$("shape");
 path.setAttribute("d",pathGenerator(feature)||"");

 const bounds=path.getBBox();
 const pad=Math.max(bounds.width,bounds.height)*.12+1;
 svg.setAttribute(
  "viewBox",
  `${bounds.x-pad} ${bounds.y-pad} ${bounds.width+2*pad} ${bounds.height+2*pad}`
 );

 const choices=shuffle([
  id,
  ...shuffle(ids.filter(other=>other!==id)).slice(0,3)
 ]);

 $("answers").replaceChildren();

 choices.forEach(choice=>{
  const button=document.createElement("button");
  button.textContent=states[choice];
  button.addEventListener("click",()=>answer(choice,id));
  $("answers").append(button);
 });
}

function answer(choice,correct) {
 if(answered)return;
 answered=true;
 const right=choice===correct;
 if(right)points++;

 $("score").textContent=`Score: ${points}`;
 $("status").textContent=right
  ?"✅ Correct!"
  :`❌ That's ${states[correct]}.`;

 [...$("answers").children].forEach(button=>{
  button.disabled=true;
  if(button.textContent===states[correct])
   button.classList.add("correct");
  else if(button.textContent===states[choice])
   button.classList.add("wrong");
 });

 $("next").disabled=false;
 if(index===49)
  $("next").textContent="See my results →";
}

function next() {
 if(index<49) {
  index++;
  showQuestion();
  return;
 }
 $("bar").style.width="100%";
 $("count").textContent="All 50 states completed";
 $("status").textContent=
  `You identified ${points} out of 50 states!`;
 $("map").style.display="none";
 $("answers").replaceChildren();
 $("next").textContent="Play again ↻";
 $("next").onclick=()=>{
  $("map").style.display="";
  $("next").onclick=next;
  startGame();
 };
}

$("next").onclick=next;

(async()=>{
 try {
  if(!window.d3||!window.topojson)
   throw new Error("Map libraries did not load.");

  const response=await fetch(
   "https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"
  );
  if(!response.ok)
   throw new Error("The state outlines could not be downloaded.");

  const atlas=await response.json();
  const features=topojson.feature(
   atlas,atlas.objects.states
  ).features;

  shapes=new Map(
   features.map(f=>[String(f.id).padStart(2,"0"),f])
  );

  if(ids.some(id=>!shapes.has(id)))
   throw new Error("Some state outlines are missing.");

  startGame();
 } catch(error) {
  $("count").textContent="Unable to load quiz";
  $("status").textContent=
   "The map requires an internet connection.";
  $("error").textContent=error.message;
 }
})();
</script>
</body>
</html>
