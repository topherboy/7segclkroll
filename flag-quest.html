<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flag Quest</title></head><body style="background:#f3f7ff;margin:0;padding:16px"><div id="flaglight" style="background:#f3f7ff;color:#142642;padding:16px;border-radius:18px;font-family:system-ui,-apple-system,sans-serif;max-width:580px;margin:auto" data-booted="yes">
<style>
#flaglight,#flaglight *{box-sizing:border-box}#flaglight button{cursor:pointer;font-family:inherit;touch-action:manipulation}#flaglight .fqstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}#flaglight .fqstat{background:white;border:1px solid #cbd6e7;border-radius:12px;text-align:center;padding:10px 4px}#flaglight .fqstat b{font-size:21px;display:block;color:#142642}#flaglight .fqstat small{font-size:10px;color:#37506e;font-weight:700}#flaglight .fqbtn{border:2px solid #9eb3d1;background:#eaf1ff;color:#122b50;font-size:15px;font-weight:750;line-height:1.3;padding:15px 7px;min-height:74px;border-radius:12px;width:100%}#flaglight .fqbtn.good{background:#d4f6e7;border-color:#078151;color:#075137}#flaglight .fqbtn.bad{background:#ffe1e7;border-color:#c02643;color:#9d1936}#flaglight .fqaction{border:0;border-radius:12px;padding:12px 11px;font-size:14px;font-weight:750;color:white;background:#1c50aa}#flaglight .fqaction.alt{background:#e2ebf9;color:#19365f;border:1px solid #a4b9d5}#flaglight .fqaction:disabled{opacity:.45}#flaglight .fqbtn:focus-visible,#flaglight .fqaction:focus-visible{outline:3px solid #e89e13;outline-offset:2px}
</style>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<div><div style="font-size:11px;color:#2458a8;letter-spacing:1px;font-weight:800">AROUND THE WORLD</div><div style="font-size:23px;font-weight:900">🌍 Flag Quest</div></div>
<button class="fqaction alt" id="fl-restart">↻ Restart</button>
</div>
<div style="display:flex;gap:8px;margin-top:14px">
<button class="fqaction " id="fl-all" style="flex:1">All 195</button><button class="fqaction alt" id="fl-missed" style="flex:1">Missed (0)</button>
</div>
<div class="fqstats"><div class="fqstat"><b id="fl-score">0</b><small>CORRECT</small></div><div class="fqstat"><b id="fl-streak">0 🔥</b><small>STREAK</small></div><div class="fqstat"><b id="fl-left">195</b><small>REMAINING</small></div></div>
<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:650;margin-bottom:7px"><span id="fl-progresslabel">Flag 1 of 195</span><span id="fl-percent">0%</span></div>
<div style="height:9px;border-radius:9px;background:#d5e2f3;overflow:hidden;margin-bottom:16px"><div id="fl-bar" style="height: 100%; width: 0%; background: rgb(29, 85, 187); transition: width 0.25s;"></div></div>
<div style="background:white;border:1px solid #c6d5ea;border-radius:18px;padding:18px 12px;text-align:center">
<div id="fl-quiz" style="display: block;">
<div style="font-size:12px;color:#2654a0;font-weight:800;letter-spacing:1px">GUESS THE COUNTRY</div>
<div id="fl-flag" style="height:145px;display:flex;align-items:center;justify-content:center;font-size:104px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🇬🇦</div>
<div style="font-size:21px;font-weight:850;color:#142642;margin-bottom:5px">Which country is this?</div>
<div style="font-size:13px;color:#435873;margin-bottom:18px">Choose the correct answer</div>
<div id="fl-answers" style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><button class="fqbtn" data-country="GA">Gabon</button><button class="fqbtn" data-country="BG">Bulgaria</button><button class="fqbtn" data-country="CY">Cyprus</button><button class="fqbtn" data-country="DK">Denmark</button></div>
<div id="fl-feedback" role="status" aria-live="polite" style="min-height:48px;margin:13px 0 6px;font-weight:750;color:#142642"></div>
<div style="display:flex;gap:9px"><button id="fl-skip" class="fqaction alt">Skip</button><button id="fl-next" class="fqaction" style="flex:1" disabled="">Next flag →</button></div>
</div>
<div id="fl-end" style="display:none;padding:24px 4px"><div style="font-size:68px">🏆</div><div style="font-size:22px;font-weight:850">World tour complete!</div><p id="fl-summary" style="line-height:1.5;color:#334d6b"></p><button class="fqaction" id="fl-again" style="width:100%">Play again</button><button class="fqaction alt" id="fl-review" style="width:100%;margin-top:9px">Practice missed flags</button></div>
</div>
<button id="fl-copy" class="fqaction alt" style="width:100%;margin-top:14px">📋 Copy HTML source</button>
<div id="fl-copymsg" style="font-size:12px;color:#435873;text-align:center;margin-top:7px"></div>
<script>
(()=>{
const root=document.getElementById('flaglight');if(root.dataset.booted)return;root.dataset.booted='yes';
const raw=`AF|Afghanistan;AL|Albania;DZ|Algeria;AD|Andorra;AO|Angola;AG|Antigua and Barbuda;AR|Argentina;AM|Armenia;AU|Australia;AT|Austria;AZ|Azerbaijan;BS|The Bahamas;BH|Bahrain;BD|Bangladesh;BB|Barbados;BY|Belarus;BE|Belgium;BZ|Belize;BJ|Benin;BT|Bhutan;BO|Bolivia;BA|Bosnia and Herzegovina;BW|Botswana;BR|Brazil;BN|Brunei;BG|Bulgaria;BF|Burkina Faso;BI|Burundi;CV|Cabo Verde;KH|Cambodia;CM|Cameroon;CA|Canada;CF|Central African Republic;TD|Chad;CL|Chile;CN|China;CO|Colombia;KM|Comoros;CG|Republic of the Congo;CD|DR Congo;CR|Costa Rica;CI|Côte d'Ivoire;HR|Croatia;CU|Cuba;CY|Cyprus;CZ|Czechia;DK|Denmark;DJ|Djibouti;DM|Dominica;DO|Dominican Republic;EC|Ecuador;EG|Egypt;SV|El Salvador;GQ|Equatorial Guinea;ER|Eritrea;EE|Estonia;SZ|Eswatini;ET|Ethiopia;FJ|Fiji;FI|Finland;FR|France;GA|Gabon;GM|The Gambia;GE|Georgia;DE|Germany;GH|Ghana;GR|Greece;GD|Grenada;GT|Guatemala;GN|Guinea;GW|Guinea-Bissau;GY|Guyana;HT|Haiti;HN|Honduras;HU|Hungary;IS|Iceland;IN|India;ID|Indonesia;IR|Iran;IQ|Iraq;IE|Ireland;IL|Israel;IT|Italy;JM|Jamaica;JP|Japan;JO|Jordan;KZ|Kazakhstan;KE|Kenya;KI|Kiribati;KP|North Korea;KR|South Korea;KW|Kuwait;KG|Kyrgyzstan;LA|Laos;LV|Latvia;LB|Lebanon;LS|Lesotho;LR|Liberia;LY|Libya;LI|Liechtenstein;LT|Lithuania;LU|Luxembourg;MG|Madagascar;MW|Malawi;MY|Malaysia;MV|Maldives;ML|Mali;MT|Malta;MH|Marshall Islands;MR|Mauritania;MU|Mauritius;MX|Mexico;FM|Micronesia;MD|Moldova;MC|Monaco;MN|Mongolia;ME|Montenegro;MA|Morocco;MZ|Mozambique;MM|Myanmar;NA|Namibia;NR|Nauru;NP|Nepal;NL|Netherlands;NZ|New Zealand;NI|Nicaragua;NE|Niger;NG|Nigeria;MK|North Macedonia;NO|Norway;OM|Oman;PK|Pakistan;PW|Palau;PS|Palestine;PA|Panama;PG|Papua New Guinea;PY|Paraguay;PE|Peru;PH|Philippines;PL|Poland;PT|Portugal;QA|Qatar;RO|Romania;RU|Russia;RW|Rwanda;KN|Saint Kitts and Nevis;LC|Saint Lucia;VC|Saint Vincent and the Grenadines;WS|Samoa;SM|San Marino;ST|São Tomé and Príncipe;SA|Saudi Arabia;SN|Senegal;RS|Serbia;SC|Seychelles;SL|Sierra Leone;SG|Singapore;SK|Slovakia;SI|Slovenia;SB|Solomon Islands;SO|Somalia;ZA|South Africa;SS|South Sudan;ES|Spain;LK|Sri Lanka;SD|Sudan;SR|Suriname;SE|Sweden;CH|Switzerland;SY|Syria;TJ|Tajikistan;TZ|Tanzania;TH|Thailand;TL|Timor-Leste;TG|Togo;TO|Tonga;TT|Trinidad and Tobago;TN|Tunisia;TR|Türkiye;TM|Turkmenistan;TV|Tuvalu;UG|Uganda;UA|Ukraine;AE|United Arab Emirates;GB|United Kingdom;US|United States;UY|Uruguay;UZ|Uzbekistan;VU|Vanuatu;VA|Vatican City;VE|Venezuela;VN|Vietnam;YE|Yemen;ZM|Zambia;ZW|Zimbabwe`;
const countries=raw.split(';').map(s=>{const [c,n]=s.split('|');return{c,n}});
const $=id=>root.querySelector('#fl-'+id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const flag=c=>[...c].map(k=>String.fromCodePoint(127397+k.charCodeAt(0))).join('');
let deck=[],index=0,score=0,streak=0,answered=false,missed=new Set(),mode='all';
function stats(){const pct=deck.length?Math.round(index/deck.length*100):100;$('score').textContent=score;$('streak').textContent=streak+' 🔥';$('left').textContent=deck.length-index;$('progresslabel').textContent=index<deck.length?`Flag ${index+1} of ${deck.length}`:'Complete';$('percent').textContent=pct+'%';$('bar').style.width=pct+'%';$('missed').textContent=`Missed (${missed.size})`}
function start(m){if(m==='missed'&&!missed.size)m='all';mode=m;deck=shuffle((m==='missed'?countries.filter(c=>missed.has(c.c)):countries).slice());index=score=streak=0;$('quiz').style.display='block';$('end').style.display='none';$('all').className='fqaction '+(m==='all'?'':'alt');$('missed').className='fqaction '+(m==='missed'?'':'alt');$('all').style.flex=$('missed').style.flex='1';render()}
function render(){stats();if(index>=deck.length){$('quiz').style.display='none';$('end').style.display='block';$('summary').textContent=`${score} correct out of ${deck.length}. ${missed.size} flags left to practice.`;$('review').style.display=missed.size?'block':'none';return}answered=false;const t=deck[index];$('flag').textContent=flag(t.c);$('feedback').textContent='';$('next').disabled=true;$('skip').disabled=false;const choices=shuffle([t,...shuffle(countries.filter(c=>c.c!==t.c).slice()).slice(0,3)]);$('answers').replaceChildren();choices.forEach(c=>{const b=document.createElement('button');b.className='fqbtn';b.textContent=c.n;b.dataset.country=c.c;b.onclick=()=>choose(c.c);$('answers').append(b)})}
function choose(c){if(answered)return;answered=true;const t=deck[index],ok=c===t.c;for(const b of $('answers').children){b.disabled=true;if(b.dataset.country===t.c)b.classList.add('good');else if(b.dataset.country===c)b.classList.add('bad')}if(ok){score++;streak++;missed.delete(t.c)}else{streak=0;missed.add(t.c)}$('feedback').textContent=ok?'✅ Correct!':c?'❌ Correct answer: '+t.n:'⏭️ Skipped — '+t.n;$('next').disabled=false;$('skip').disabled=true;stats()}
$('next').onclick=()=>{if(answered){index++;render()}};$('skip').onclick=()=>choose('');$('restart').onclick=()=>start(mode);$('all').onclick=()=>start('all');$('missed').onclick=()=>{if(missed.size)start('missed')};$('again').onclick=()=>{missed.clear();start('all')};$('review').onclick=()=>start('missed');
$('copy').onclick=async()=>{const clone=root.cloneNode(true);clone.querySelector('#fl-copymsg').textContent='';const doc='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flag Quest</title></head><body style="background:#f3f7ff;margin:0;padding:16px">'+clone.outerHTML+'</body></html>';try{await navigator.clipboard.writeText(doc);$('copymsg').textContent='✅ HTML copied to clipboard'}catch(e){$('copymsg').textContent='Use the HTML download link below'}};
start('all');
})();
</script>
</div></body></html>
